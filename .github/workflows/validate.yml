name: Repository checks

on:
  push:
    branches: [main, "maintenance/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f index.html
          test -f firmware/openvision_cam/openvision_cam.ino
          test -f firmware/openvision_cam/config.example.h
          test -f docs/Public_Build_Guide.md
          test -f docs/BOM.md
          test -f SECURITY.md
          test -f LICENSE
          test -f LICENSES/CERN-OHL-P-2.0.txt
          echo "Required project files are present."
      - name: Check for known published default credential
        shell: bash
        run: |
          set -euo pipefail
          published_default="$(printf 'openvision%s' '123')"
          if grep -R --exclude-dir=.git --exclude='*.md' -n "$published_default" .; then
            echo "::error::The previously published default password is still present."
            exit 1
          fi
      - name: Compile ESP32-CAM firmware
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "::add-path::$PWD/bin"
          ./bin/arduino-cli core update-index
          ./bin/arduino-cli core install esp32:esp32@2.0.17
          cp firmware/openvision_cam/config.example.h firmware/openvision_cam/config.h
          ./bin/arduino-cli compile --fqbn esp32:esp32:esp32wrover firmware/openvision_cam
      - name: Check whitespace errors
        run: git diff --check
